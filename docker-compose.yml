services:
  # -------------------------------------------------------------
  # 1. Agenda / Portal / Perizinan / PKL (Laravel)
  # -------------------------------------------------------------
  gaddamay-agenda:
    build:
      context: .
      dockerfile: docker/agenda/Dockerfile
    container_name: gaddamay_agenda
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      WA_GATEWAY_DRIVER: ${WA_GATEWAY_DRIVER}
      WA_GATEWAY_URL: ${WA_GATEWAY_URL}
    volumes:
      - ./apps/agenda/storage:/var/www/html/storage
      - ./apps/agenda/public/uploads:/var/www/html/public/uploads
    networks:
      - db
      - net

  # -------------------------------------------------------------
  # 2. Absensi Gate / RFID / QR (CodeIgniter 4)
  # -------------------------------------------------------------
  gaddamay-absensi:
    build:
      context: .
      dockerfile: docker/absensi/Dockerfile
    container_name: gaddamay_absensi
    restart: unless-stopped
    environment:
      CI_ENVIRONMENT: ${CI_ENVIRONMENT}
      app.baseURL: ${ABSENSI_URL}
      database.default.hostname: ${DB_HOST}
      database.default.port: ${DB_PORT}
      database.default.database: ${DB_DATABASE}
      database.default.username: ${DB_USERNAME}
      database.default.password: ${DB_PASSWORD}
      database.default.DBDriver: MySQLi
    volumes:
      - ./apps/absensi/writable:/var/www/html/writable
    networks:
      - db
      - net

networks:
  db:
    external: true
    name: ${NET_DB}
  net:
    external: true
    name: ${NET_NET}
