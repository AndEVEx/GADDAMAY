<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a56db"/>
      <stop offset="100%" style="stop-color:#0d47a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Book icon -->
  <g transform="translate(96, 80)" fill="white">
    <!-- Book body -->
    <rect x="40" y="20" width="240" height="300" rx="12" fill="white" opacity="0.95"/>
    <!-- Book spine -->
    <rect x="40" y="20" width="24" height="300" rx="8" fill="white" opacity="0.7"/>
    <!-- Lines -->
    <rect x="88" y="72" width="160" height="8" rx="4" opacity="0.2"/>
    <rect x="88" y="104" width="140" height="8" rx="4" opacity="0.2"/>
    <rect x="88" y="136" width="160" height="8" rx="4" opacity="0.2"/>
    <rect x="88" y="168" width="120" height="8" rx="4" opacity="0.2"/>
    <!-- Checkmark circle -->
    <circle cx="200" cy="260" r="40" fill="#059669"/>
    <polyline points="180,260 195,275 220,245" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
