<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Agenda Guru</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
        .container { text-align: center; max-width: 400px; }
        .icon { font-size: 4rem; margin-bottom: 1rem; }
        h1 { color: #1a56db; font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #6b7280; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 1.5rem; padding: 0.75rem 2rem; background: #1a56db; color: white; border: none; border-radius: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>Tidak Ada Koneksi</h1>
        <p>Perangkat Anda sedang offline. Silakan periksa koneksi internet dan coba lagi.</p>
        <a href="/" class="btn">Coba Lagi</a>
    </div>
</body>
</html>
